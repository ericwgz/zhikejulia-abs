server {
    listen 80;
    listen [::]:80;
    server_name zhikejulia.com www.zhikejulia.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://zhikejulia.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zhikejulia.com www.zhikejulia.com;
    ssl_certificate /etc/letsencrypt/live/zhikejulia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhikejulia.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/badrams/current/app/static/abs;
    index index.html;
    client_max_body_size 64k;
    access_log /var/log/nginx/zhikejulia.access.log;
    error_log /var/log/nginx/zhikejulia.error.log;
    location = /api/abs/work/stress/contract {
        client_max_body_size 7m;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
    location /api/abs/work/stress/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
    location /api/abs/ {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
    }
    location = /abs { return 308 /; }
    location /abs/ { rewrite ^/abs/(.*)$ /$1 permanent; }
    location / { try_files $uri $uri/ /index.html; }
}
